name: Auto-bump
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  bump:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set bot git identity
        run: |
          git config user.name "computeralex92-bot"
          git config user.email "computeralex92+bot@users.noreply.github.com"

      - uses: Homebrew/actions/setup-homebrew@main

      - uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.BUMP_BOT_TOKEN }}
          formulae: fleetctl ingress-nginx-migration
          fork: false

      - name: Enable auto-merge on bump PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.BUMP_BOT_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --author "computeralex92" \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bump-fleetctl")) | .number' \
            | head -1)
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --auto --squash
            echo "Enabled auto-merge on PR #$PR_NUMBER"
          else
            echo "No bump PR found, skipping auto-merge"
          fi
