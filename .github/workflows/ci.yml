name: CI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Formula/*.rb'
      - 'Casks/*.rb'
  push:
    branches: [main]
    paths:
      - 'Formula/*.rb'
      - 'Casks/*.rb'

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run brew style
        run: |
          shopt -s nullglob
          files=( Formula/*.rb Casks/*.rb )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No formula or cask files to check"
          else
            brew style "${files[@]}"
          fi

      - name: Run brew audit
        run: |
          shopt -s nullglob
          files=( Formula/*.rb Casks/*.rb )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No formula or cask files to audit"
          else
            brew tap computeralex92/tap "$PWD"
            for f in "${files[@]}"; do
              name=$(basename "$f" .rb)
              brew audit --strict --online "computeralex92/tap/$name"
            done
          fi
