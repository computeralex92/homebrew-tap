name: Require pr-pull label for formula changes
on:
  pull_request_target:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for formula changes without pr-pull label
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const hasLabel = context.payload.pull_request.labels
              .some(label => label.name === 'pr-pull');

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const formulaChanged = files.some(f =>
              f.filename.startsWith('Formula/') || f.filename.startsWith('Casks/')
            );

            if (formulaChanged && !hasLabel && author !== 'renovate[bot]') {
              core.setFailed(
                'This PR modifies a formula but is missing the "pr-pull" label. ' +
                'Add it after CI passes to trigger bottle publishing via brew pr-pull.'
              );
            }
