name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to test
        required: false
        type: string

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macOS ARM
          - os: macos-26-intel
            name: macOS Intel
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Homebrew/actions/setup-homebrew@main

      - run: brew test-bot --only-tap-syntax

      - name: Determine changed formulae
        id: formula
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMULAE=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- Formula/ | sed 's|Formula/||;s|\.rb$||' | tr '\n' ' ')
          elif [ "${{ github.event_name }}" = "push" ]; then
            FORMULAE=$(git diff --name-only HEAD~1 -- Formula/ | sed 's|Formula/||;s|\.rb$||' | tr '\n' ' ')
          else
            FORMULAE="${{ inputs.formula }}"
          fi
          echo "formulae=${FORMULAE}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.formula.outputs.formulae != '' && github.event_name == 'pull_request'
        run: |
          for formula in ${{ steps.formula.outputs.formulae }}; do
            brew test-bot --only-formulae "$formula" \
              --root-url=https://ghcr.io/v2/computeralex92/tap
            rm -f ./*.bottle.* 2>/dev/null || true
          done

      - name: Test on push
        if: steps.formula.outputs.formulae != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          for formula in ${{ steps.formula.outputs.formulae }}; do
            brew test-bot --only-formulae "$formula" \
              --root-url=https://ghcr.io/v2/computeralex92/tap
            rm -f ./*.bottle.* 2>/dev/null || true
          done
