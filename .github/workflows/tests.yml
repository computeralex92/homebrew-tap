name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to build and publish bottles for'
        required: false
        type: string

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: write
      packages: write
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Base64-encode GITHUB_TOKEN for HOMEBREW_DOCKER_REGISTRY_TOKEN
        id: base64-encode
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base64_token=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${base64_token}"
          echo "token=${base64_token}" >> "${GITHUB_OUTPUT}"

      - name: Test formula and build bottles
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae --root-url=https://ghcr.io/v2/computeralex92/tap
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Build and publish bottles
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FORMULAE=$(git diff --name-only HEAD~1 HEAD -- Formula/ | sed 's|Formula/||;s|\.rb$||')
          else
            FORMULAE="${{ inputs.formula }}"
          fi
          if [ -z "$FORMULAE" ]; then
            echo "No formulae to publish"
            exit 0
          fi
          for formula in $FORMULAE; do
            brew test-bot --only-formulae "$formula" --root-url=https://ghcr.io/v2/computeralex92/tap --publish
          done
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.base64-encode.outputs.token }}

      - name: Commit bottle block
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.os == 'macos-26' && steps.base64-encode.conclusion == 'success'
        run: |
          if ! git status --porcelain Formula/ | grep -q .; then
            echo "No formula changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git add Formula/
          git commit -m "fleetctl: update bottle block"
          git pull --rebase origin main
          git push origin main

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
