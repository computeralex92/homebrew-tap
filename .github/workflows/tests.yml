name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to build and publish
        required: false
        type: string

jobs:
  test:
    runs-on: macos-26
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - run: brew test-bot --only-tap-syntax

      - name: Determine changed formula
        id: formula
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMULA=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- Formula/ | sed 's|Formula/||;s|\.rb$||')
          elif [ "${{ github.event_name }}" = "push" ]; then
            FORMULA=$(git diff --name-only HEAD~1 -- Formula/ | sed 's|Formula/||;s|\.rb$||')
          else
            FORMULA="${{ inputs.formula }}"
          fi
          echo "formula=${FORMULA}" >> "$GITHUB_OUTPUT"

      - name: Base64-encode GITHUB_TOKEN for registry
        id: token
        if: steps.formula.outputs.formula != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          encoded=$(echo -n "${TOKEN}" | base64 | tr -d "\n")
          echo "::add-mask::${encoded}"
          echo "token=${encoded}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        if: steps.formula.outputs.formula != '' && github.event_name == 'pull_request'
        run: |
          brew test-bot --only-formulae "${{ steps.formula.outputs.formula }}" \
            --root-url=https://ghcr.io/v2/computeralex92/tap
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}

      - name: Publish on push
        if: steps.formula.outputs.formula != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          brew test-bot --only-formulae "${{ steps.formula.outputs.formula }}" \
            --root-url=https://ghcr.io/v2/computeralex92/tap --publish
        env:
          HOMEBREW_DOCKER_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
