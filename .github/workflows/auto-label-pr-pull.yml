name: Auto-label Renovate PRs with pr-pull after CI
on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  label:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const prs = github.event.workflow_run.pull_requests;
            if (!prs.length) return;

            for (const pr of prs) {
              const { data: pull } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });

              if (pull.user.login !== 'renovate[bot]') continue;

              const hasLabel = pull.labels.some(l => l.name === 'pr-pull');
              if (hasLabel) continue;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['pr-pull'],
              });
            }
